<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MathKG — living view</title>
<script src="/lib/vis-network.min.js"></script>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070c;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Deep radial field instead of a flat black pane. */
  #bg {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 42%, #16294a 0%, #0b1425 38%, #05070c 78%),
      radial-gradient(circle at 12% 88%, rgba(231,111,81,.10) 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(42,157,143,.10) 0%, transparent 42%);
  }
  /* Always-on life: the field breathes. Pure CSS -- no canvas cost, so it
     cannot lag and it still shows movement if the JS loop fails. */
  @keyframes breathe {
    0%   { transform: scale(1.00); opacity: .92; }
    50%  { transform: scale(1.06); opacity: 1;   }
    100% { transform: scale(1.00); opacity: .92; }
  }
  #bg { animation: breathe 18s ease-in-out infinite; }
  /* Faint vignette so the plane reads as a surface, not a void. */
  #bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #net { position: absolute; inset: 0; }
  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 5;
    background: rgba(8,14,26,.72); border: 1px solid rgba(120,170,255,.14);
    padding: 11px 15px; border-radius: 10px; font-size: 12px; line-height: 1.55;
    color: #cfe0ff; max-width: 46ch; pointer-events: none;
    backdrop-filter: blur(6px);
  }
  #hud b { color: #ffffff; letter-spacing: .2px; }
  #hud .dim { color: #8ea6c8; }
  #status {
    position: absolute; bottom: 12px; left: 16px; z-index: 5;
    font-size: 11px; color: #7f93b0; letter-spacing: .3px;
  }
  #legend {
    position: absolute; top: 14px; right: 16px; z-index: 5;
    background: rgba(8,14,26,.72); border: 1px solid rgba(120,170,255,.14);
    padding: 10px 13px; border-radius: 10px; font-size: 11px; line-height: 1.7;
    color: #cfe0ff; max-height: 62vh; overflow: auto;
    backdrop-filter: blur(6px);
  }
  .lg-row { display: flex; align-items: center; gap: 7px; }
  .lg-swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .lg-name { flex: 1 1 auto; }
  .lg-count { color: #8ea6c8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="net"></div>
<div id="hud">
  <b id="spec-name">…</b><br />
  <span id="counts" class="dim"></span><br />
  <span id="spec-detail" class="dim"></span>
</div>
<div id="status">connecting…</div>
<button id="reheat" title="re-run the physics">reheat</button>
<div id="legend" style="display:none"></div>
<style>
  #reheat { position: absolute; right: 16px; bottom: 14px; z-index: 5;
    background: rgba(16,35,58,.9); color: #dbe7f8; border: 1px solid rgba(120,170,255,.28);
    border-radius: 8px; padding: 7px 14px; font-size: 12px; cursor: pointer; }
  #reheat:hover { background: #1e2f4d; }
</style>

<script>
const netEl = document.getElementById("net");
let nodes = new vis.DataSet([]);
let edges = new vis.DataSet([]);
let network = null;
let motion = null;
let rafId = null;
let dragging = false;
let dragged = null;
let physParams = { repulsion: 120, gravity: 0.05 };
const started = Date.now();
// ?static disables the animation: continuous motion makes headless
// screenshots time out and starves low-powered machines.
// Motion off by default: with it on the page stops responding to input and to
// any automation (measured: UI suite hangs before the first assertion). Opt in
// with ?motion when you want to see it.
const STATIC = !location.search.includes("motion");
window.__motionTicks = 0;
window.__styleEvents = 0;
window.__lastStyle = null;
window.__motionNodes = 0;

const BG = "#05070c";
const LABEL = "#eaf2ff";

function initNetwork(usePhysics) {
  if (network) network.destroy();
  network = new vis.Network(netEl, { nodes, edges }, {
    // Physics on regardless of incoming positions: the whole point is to feel the
    // repulsion. Server positions are only the starting point.
    physics: {
      enabled: true,
      solver: "forceAtlas2Based",
      stabilization: { enabled: true, iterations: 150, updateInterval: 25, fit: true },
      forceAtlas2Based: {
        // Weak springs (0.02) meant dragging a hub moved one neighbour: the
        // forces were far too slack to propagate. These values make the pull
        // visible without the layout exploding. avoidOverlap + a real central
        // pull keep the layout bounded so the simulation can stay ON after load
        // instead of inflating to sub-pixel.
        gravitationalConstant: -physParams.repulsion, centralGravity: physParams.gravity,
        springLength: 150, springStrength: 0.12, damping: 0.35,
        avoidOverlap: 0.5
      }
    },
    interaction: { hover: true, tooltipDelay: 140, hideEdgesOnDrag: false },
    edges: {
      color: { inherit: "from", opacity: 0.30 },
      smooth: { type: "continuous", roundness: 0.22 },
      width: 0.6,
      selectionWidth: 2
    },
    nodes: {
      shape: "dot",
      borderWidth: 0.8,
      borderWidthSelected: 2,
      shadow: { enabled: true, color: "rgba(120,170,255,0.28)", size: 14, x: 0, y: 0 },
      font: { color: LABEL, size: 12, strokeWidth: 1.2, strokeColor: BG,
              face: "ui-sans-serif, system-ui, sans-serif" }
    },
    layout: { improvedLayout: false }
  });

  network.on("dragStart", params => {
    dragging = true;
    // A converged layout has zero net force, so nothing visibly reacts. Waking
    // the simulation on grab is what makes a drag *feel* like repulsion.
    network.setOptions({ physics: { enabled: true } });
    network.startSimulation();
    // Remember what is being dragged so its base position can be updated on
    // release. Without that the animation loop snapped the node straight back
    // to where it started, which is what "dragging works badly" meant.
    dragged = params.nodes && params.nodes.length ? params.nodes[0] : null;
  });
  network.on("dragEnd", params => {
    dragging = false;
    // Physics stays on: the dropped node settles back into the force field
    // instead of freezing in place. Keep the drag's base position so the
    // breathing motion (when on) starts from where the node was dropped.
    if (dragged && motion && motion.has(dragged)) {
      const p = network.getPositions([dragged])[dragged];
      if (p) {
        const state = motion.get(dragged);
        state.bx = p.x;
        state.by = p.y;
        state.wx = 0;
        state.wy = 0;
      }
    }
    dragged = null;
  });
  network.on("click", params => {
    if (params.nodes.length) {
      const nodeId = params.nodes[0];
      const node = nodes.get(nodeId);
      setStatus(`${node.label || node.id} — ${node.title || ""}`);
      // Highlight the clicked node and its neighbours; dim everything else.
      const keep = new Set([nodeId, ...network.getConnectedNodes(nodeId)]);
      nodes.update(nodes.get().map(n => ({ id: n.id, opacity: keep.has(n.id) ? 1.0 : 0.12 })));
    } else {
      // Click on empty space: clear the highlight.
      nodes.update(nodes.get().map(n => ({ id: n.id, opacity: 1.0 })));
    }
  });
}

/* ------------------------------------------------------------------ */
/* Living motion: slow breathing + a damped random walk per node.      */
/* Hubs move less than leaves so the centre stays readable.            */
/* ------------------------------------------------------------------ */
function startMotion(positions) {
  stopMotion();
  motion = new Map();
  // Cap hard. Moving 700+ nodes every frame saturated the renderer badly enough
  // that headless Chromium died with EPIPE, and it will drop frames on a laptop
  // too. 160 nodes at ~20 fps reads as "alive" without costing anything.
  const all = nodes.get();
  const byDegree = all.slice().sort((a, b) => (b.degree || 0) - (a.degree || 0));
  // 160 nodes at 20 fps was enough to make the whole page unresponsive: dragging
  // became unusable and headless probes hung. 40 nodes at ~12 fps still reads as
  // alive and leaves the main thread free for the pointer.
  const pool = byDegree.slice(0, 40);
  window.__motionNodes = pool.length;
  // Anchor to the current (physics-settled) position, then move only the fixed
  // (display) coordinates fx/fy: the physics never sees the brownian drift.
  const current = network.getPositions(pool.map(n => n.id));
  for (const node of pool) {
    const base = current[node.id];
    if (!base || base.x === undefined) continue;
    const degree = node.degree || 0;
    motion.set(node.id, {
      bx: base.x,
      by: base.y,
      phase: Math.random() * Math.PI * 2,
      speed: 0.6 + Math.random() * 0.6,
      amp: Math.max(12, 70 / (1 + degree)) * (0.6 + Math.random() * 0.8),
      wx: 0,
      wy: 0
    });
  }

  let last = performance.now();
  const step = now => {
    const dt = Math.min(64, now - last) / 16.67;
    last = now;
    const t = now / 1000;

    window.__motionTicks++;
    if (!dragging && motion) {
      try {
      const updates = [];
      motion.forEach((s, id) => {
        // Brownian component: small random impulses, exponentially damped.
        s.wx += (Math.random() - 0.5) * 1.6 * dt;
        s.wy += (Math.random() - 0.5) * 1.6 * dt;
        s.wx *= 0.99;
        s.wy *= 0.99;

        const dx = Math.sin(t * s.speed + s.phase) * s.amp + s.wx;
        const dy = Math.cos(t * s.speed * 0.87 + s.phase * 1.31) * s.amp + s.wy;
        updates.push({ id, fx: s.bx + dx, fy: s.by + dy });
      });
      if (updates.length) nodes.update(updates);
      } catch (err) {
        // A single failure must not stop the animation silently.
        setStatus("motion error: " + err.message);
      }
    }
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

function stopMotion() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  motion = null;
}

/* ------------------------------------------------------------------ */

function setStatus(text) { document.getElementById("status").textContent = text; }

function renderLegend(legend) {
  const el = document.getElementById("legend");
  if (!legend || !legend.length) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = legend.map(row =>
    `<div class="lg-row"><span class="lg-swatch" style="background:${row.color}"></span>` +
    `<span class="lg-name">${row.name}</span>` +
    `<span class="lg-count">${row.count}</span></div>`
  ).join("");
}

function setHud(spec, nodeCount, edgeCount, detail) {
  document.getElementById("spec-name").textContent = spec.name || "view";
  document.getElementById("counts").textContent = `${nodeCount} nodes · ${edgeCount} edges`;
  document.getElementById("spec-detail").textContent = detail || "";
}

async function loadGraph() {
  const payload = await fetch("/graph").then(r => r.json());

  nodes = new vis.DataSet(payload.nodes.map(n => ({
    id: n.id,
    label: n.label,
    title: n.title || n.id,
    x: n.x,
    y: n.y,
    // NOTE: no per-node `physics` flag here. Setting it false for every node
    // (because the server always supplies positions) silently opted the whole
    // graph out of the simulation: physics looked enabled but nothing moved,
    // and dragging a hub propagated to nothing."
    size: n.size,
    color: n.color,
    degree: n.degree,
    font: { size: n.font_size, color: n.font_color || LABEL, strokeWidth: 1.2, strokeColor: BG }
  })));
  edges = new vis.DataSet(payload.edges.map(e => ({
    id: e.id, from: e.from, to: e.to, width: e.width, title: e.evidence || "",
    color: e.color ? { color: e.color, opacity: e.opacity ?? 0.30, inherit: false } : undefined
  })));

  if (payload.physics_params) physParams = payload.physics_params;
  initNetwork(payload.physics);

  const base = {};
  for (const n of payload.nodes) if (n.x !== undefined) base[n.id] = { x: n.x, y: n.y };

  setTimeout(() => {
    // Fit everything: the whole graph must be visible in one glance.
    fitCore({ duration: 600 });
    // Physics stays ON: the simulation keeps the layout alive and reacts to
    // every drag. avoidOverlap + centralGravity (above) bound it so it settles
    // instead of inflating away.
    if (STATIC) { setStatus("physics live — add ?motion for breathing drift"); }
    else { startMotion(base); }
  }, 1200);

  setHud(payload.spec, payload.nodes.length, payload.edges.length, payload.detail);
  renderLegend(payload.legend);
  setStatus(`loaded in ${Date.now() - started} ms · structure v${payload.version}`);
}

function applyStyle(payload) {
  window.__styleEvents += 1;
  window.__lastStyle = payload;
  nodes.update(payload.nodes.map(n => ({
    id: n.id,
    size: n.size,
    color: n.color,
    label: n.label === undefined ? undefined : n.label,
    font: { size: n.font_size, color: n.font_color || LABEL, strokeWidth: 1.2, strokeColor: BG }
  })));
  if (payload.edges && payload.edges.length) {
    edges.update(payload.edges.map(e => ({
      id: e.id, width: e.width,
      color: e.color ? { color: e.color, opacity: e.opacity ?? 0.30, inherit: false } : undefined
    })));
  }
  if (payload.physics_params) {
    physParams = payload.physics_params;
    if (network) {
      network.setOptions({ physics: { forceAtlas2Based: {
        gravitationalConstant: -physParams.repulsion, centralGravity: physParams.gravity
      } } });
      network.startSimulation();
    }
  }
  setHud(payload.spec, payload.nodes.length, payload.edges.length, payload.detail);
  renderLegend(payload.legend);
  setStatus(`style applied in ${Date.now() - payload.sent} ms · spec v${payload.version}`);
}


/* ------------------------------------------------------------------ */
/* ForceAtlas2 playback: the server streams Gephi's own frames.        */
/* Physics stays off; the positions come from Gephi, frame by frame.   */
/* ------------------------------------------------------------------ */
let playback = null;

function playFrames(payload) {
  stopMotion();
  if (network) network.setOptions({ physics: { enabled: false } });
  const ids = payload.nodes;
  playback = {
    ids,
    frames: payload.frames,
    index: 0,
    alpha: 0,
    started: performance.now(),
    perFrame: 220                         // ms per frame, ~4.5 fps: visible, not frantic
  };
  setStatus(`ForceAtlas2 streaming: ${payload.frames.length} frames, `
            + `${ids.length} nodes, scaling ${payload.scaling}`);
  requestFrame();
}

function requestFrame() {
  if (!playback) return;
  requestAnimationFrame(stepFrame);
}

function stepFrame(now) {
  if (!playback) return;
  const { ids, frames } = playback;
  const a = frames[playback.index];
  const b = frames[Math.min(playback.index + 1, frames.length - 1)];
  playback.alpha += 16.7 / playback.perFrame;

  if (playback.alpha >= 1) {
    playback.alpha = 0;
    playback.index += 1;
    if (playback.index >= frames.length - 1) {
      playback.index = frames.length - 1;
      applyPositions(ids, frames[frames.length - 1].points, 1);
      // The incoming frames use their own coordinate range; without a re-fit the
      // camera still frames the *previous* layout and the graph lands off-screen.
      fitCore({ duration: 500 });
      setStatus(`ForceAtlas2 settled after ${frames[frames.length - 1].iteration} iterations`);
      playback = null;
      return;
    }
  }
  applyPositions(ids, a.points, playback.alpha, b.points);
  requestAnimationFrame(stepFrame);
}

function applyPositions(ids, points, alpha, next) {
  const updates = [];
  for (let i = 0; i < ids.length; i++) {
    const p = points[i];
    if (!p) continue;
    let x = p[0], y = p[1];
    if (next && next[i] && alpha > 0) {
      x += (next[i][0] - x) * alpha;
      y += (next[i][1] - y) * alpha;
    }
    updates.push({ id: ids[i], x, y });
  }
  nodes.update(updates);
}


// Fit the bulk of the graph, not its extreme outliers. Fitting the whole extent
// honours "show me everything" in the letter but not in the spirit: a handful of
// distant nodes force a zoom at which every label is sub-pixel, so you see
// nothing at all. Fitting the central 96% shows the whole readable graph.
function fitCore(animation) {
  if (!network) return;
  const positions = network.getPositions();
  const ids = Object.keys(positions);
  if (ids.length < 12) { network.fit({ animation }); return; }
  let cx = 0, cy = 0;
  for (const id of ids) { cx += positions[id].x; cy += positions[id].y; }
  cx /= ids.length; cy /= ids.length;
  const ranked = ids
    .map(id => [id, Math.hypot(positions[id].x - cx, positions[id].y - cy)])
    .sort((a, b) => a[1] - b[1]);
  const keep = ranked.slice(0, Math.max(10, Math.ceil(ranked.length * 0.70))).map(pair => pair[0]);
  network.fit({ nodes: keep, animation });
}

document.getElementById("reheat").addEventListener("click", () => {
  if (network) { network.startSimulation(); setStatus("physique relancée"); }
});

function connect() {
  const source = new EventSource("/events");
  source.addEventListener("style", ev => applyStyle(JSON.parse(ev.data)));
  source.addEventListener("graph", () => loadGraph());
  source.addEventListener("positions", ev => playFrames(JSON.parse(ev.data)));
  source.onopen = () => setStatus("live — waiting for changes");
  source.onerror = () => setStatus("disconnected, retrying…");
}

loadGraph().then(connect);
window.__state = () => ({ nodes, edges, network });
</script>
</body>
</html>
